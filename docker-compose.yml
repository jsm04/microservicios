services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservicios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "3003:3003"
    environment:
      JWT_SECRET: microservicios-jwt-secret-2024
      PASSWORD_SALT: microservicios-salt-2024
      JWT_ISSUER: microservicios-auth
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3003/login || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microservicios
      USER_SERVICE_URL: http://user-service:3001
      JWT_SECRET: microservicios-jwt-secret-2024
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microservicios
      USER_SERVICE_URL: http://user-service:3001
      JWT_SECRET: microservicios-jwt-secret-2024
    depends_on:
      user-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3002/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
